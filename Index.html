<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edgecore.ai - Universal Local-First OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.glass-panel{background:rgba(17,24,39,0.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08)}</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">
<header class="border-b border-gray-800 glass-panel sticky top-0 z-40">
<div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-xl bg-black border border-blue-500/50 flex items-center justify-center">
<svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M16 2L28 9V17C28 23 23 28 16 30C9 28 4 23 4 17V9L16 2Z" stroke="#3B82F6" stroke-width="1.6"/><text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#60A5FA" font-weight="800" font-size="10.5">EC</text></svg>
</div>
<div><span class="text-xl font-extrabold">edgecore<span class="text-blue-500">.ai</span></span><span class="text-[10px] text-blue-400 font-mono block -mt-1 tracking-[0.18em]">YOUR DATA STAYS ON YOUR DEVICE</span></div>
</div>
<select id="roleSelector" onchange="changeWorkspaceRole(this.value)" class="bg-gray-800 text-sm rounded px-3 py-1 border border-gray-700"><option value="universal" selected>Universal OS</option><option value="business">Business & Ledger</option><option value="legal">Legal & Cases</option><option value="medical">Medical & Diary</option><option value="tech">Developer & Code</option><option value="creator">Content Creator</option></select>
</div>
</header>
<main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
<div class="mb-8 p-4 rounded-2xl bg-gradient-to-r from-gray-900 to-blue-950/30 border border-gray-800 flex justify-between items-center"><div class="flex items-center space-x-4"><i id="contextIcon" class="fa-solid fa-layer-group text-2xl text-blue-400"></i><div><h1 id="contextTitle" class="font-bold">Universal Workspace Active</h1><p id="contextDesc" class="text-xs text-gray-400">All data processed locally. Your data stays on your device.</p></div></div><span class="text-xs text-gray-400 bg-gray-950 px-3 py-2 rounded-xl border border-gray-800"><i class="fa-solid fa-shield-halved text-blue-500"></i> Your Data Stays On Your Device</span></div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
<div class="glass-panel p-6 rounded-2xl"><h2 class="font-bold mb-4"><i class="fa-solid fa-wallet text-green-500 mr-2"></i>Local Ledger</h2><form id="ledgerForm" onsubmit="addLedgerEntry(event)" class="space-y-3"><input id="ledgerDesc" placeholder="Description" required class="w-full bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><div class="grid grid-cols-2 gap-2"><input id="ledgerAmount" type="number" placeholder="Amount" required class="w-full bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><select id="ledgerType" class="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><option value="inflow">Inflow</option><option value="outflow">Outflow</option></select></div><button class="w-full bg-green-600 text-white text-xs py-2 rounded">Add Entry</button></form><div class="grid grid-cols-2 gap-3 my-4"><div class="p-3 bg-emerald-950/30 rounded-xl"><span class="text-[10px]">Inflow</span><span id="totalInflow" class="block font-bold">$0.00</span></div><div class="p-3 bg-red-950/30 rounded-xl"><span class="text-[10px]">Outflow</span><span id="totalOutflow" class="block font-bold">$0.00</span></div></div><div id="ledgerEntries" class="space-y-2 max-h-48 overflow-y-auto"></div></div>
<div class="glass-panel p-6 rounded-2xl"><h2 class="font-bold mb-4"><i class="fa-solid fa-calendar-check text-blue-500 mr-2"></i>Universal Schedule & Log</h2><form id="taskForm" onsubmit="addScheduleTask(event)" class="space-y-3"><input id="taskText" placeholder="Schedule task..." required class="w-full bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><div class="grid grid-cols-2 gap-2"><input id="taskTime" type="time" class="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><select id="taskPriority" class="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-xs"><option>Normal</option><option>High</option></select></div><button class="w-full bg-blue-600 text-white text-xs py-2 rounded">Save Schedule</button></form><div id="taskList" class="space-y-2 mt-4"></div></div>
<div class="glass-panel p-6 rounded-2xl"><h2 class="font-bold mb-4"><i class="fa-solid fa-key text-purple-500 mr-2"></i>Encrypted Vault & Local AI</h2><textarea id="vaultNote" rows="4" placeholder="Store confidential notes..." class="w-full bg-gray-900 border border-gray-800 rounded p-3 text-xs"></textarea><div class="flex gap-2 mt-3"><button onclick="saveVaultNote()" class="flex-1 bg-purple-600 text-white text-xs py-2 rounded">Encrypt & Save</button><button onclick="clearVaultNote()" class="bg-gray-800 text-xs px-3 py-2 rounded">Clear</button></div></div>
</div>
</main>
<script>
let ledgerData=JSON.parse(localStorage.getItem('edgecore_ledger')||'[]'),taskData=JSON.parse(localStorage.getItem('edgecore_tasks')||'[]');
function addLedgerEntry(e){e.preventDefault();ledgerData.push({desc:ledgerDesc.value,amount:parseFloat(ledgerAmount.value),type:ledgerType.value});localStorage.setItem('edgecore_ledger',JSON.stringify(ledgerData));renderLedger();ledgerDesc.value='';}
function renderLedger(){let c=document.getElementById('ledgerEntries');c.innerHTML='';let inf=0,out=0;ledgerData.forEach(i=>{if(i.type=='inflow')inf+=i.amount;else out+=i.amount;let d=document.createElement('div');d.className='p-2 bg-gray-900 border border-gray-800 rounded flex justify-between text-xs';d.innerHTML=`<span>${i.desc}</span><span>$${i.amount}</span>`;c.appendChild(d);});totalInflow.innerText='$'+inf;totalOutflow.innerText='$'+out;}
function addScheduleTask(e){e.preventDefault();taskData.push({text:taskText.value,time:taskTime.value});localStorage.setItem('edgecore_tasks',JSON.stringify(taskData));renderTasks();}
function renderTasks(){let c=document.getElementById('taskList');c.innerHTML='';taskData.forEach(i=>{let d=document.createElement('div');d.className='p-2 bg-gray-900 border border-gray-800 rounded text-xs';d.innerHTML=i.text+' - '+(i.time||'No time');c.appendChild(d);});}
function changeWorkspaceRole(r){let m={universal:{title:"Universal Workspace Active",desc:"All data processed locally. Your data stays on your device.",icon:"fa-layer-group"},business:{title:"Business Mode",desc:"Manage ledger",icon:"fa-briefcase"},legal:{title:"Legal Mode",desc:"Case schedules",icon:"fa-scale-balanced"},medical:{title:"Medical Mode",desc:"Patient logs",icon:"fa-stethoscope"},tech:{title:"Dev Mode",desc:"Code snippets",icon:"fa-code"},creator:{title:"Creator Suite",desc:"Content ideas",icon:"fa-video"}};contextTitle.innerText=m[r].title;contextDesc.innerText=m[r].desc;contextIcon.className=`fa-solid ${m[r].icon} text-2xl text-blue-400`;}
function saveVaultNote(){localStorage.setItem('edgecore_vault',vaultNote.value);alert('Saved locally!');}
function clearVaultNote(){vaultNote.value='';localStorage.removeItem('edgecore_vault');}
document.addEventListener('DOMContentLoaded',()=>{renderLedger();renderTasks();});
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </html>
